name: Verify full SMHI pipeline
on: [push]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    container:
      image: rootproject/root:6.34.00-ubuntu24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Clean the raw station data
        run: |
          root-config --version
          tar -xzf datasets/datasets.tgz -C datasets
          make smhi_cleaner
          ./smhi_cleaner
          test "$(find results/data_cleaning/dataset_clean -type f -name '*.csv' | wc -l)" -eq 11
          test "$(find results/data_cleaning/removed_records -type f -name '*.csv' | wc -l)" -eq 11
      - name: Convert fresh CSVs to ROOT and check all stations
        run: |
          mv Climate_data_file.root /tmp/original-climate-data.root
          # The CI job already runs inside a ROOT container.
          sed -i 's|/projects/hep/fs11/share/mnxb11/bin/startmnxb11container.sh root|root -b|' scripts/csv_to_ttree/process_files.sh
          CLEAN_DATA_PATH=results/data_cleaning/dataset_clean bash scripts/csv_to_ttree/process_files.sh 2>&1 | tee conversion.log
          test -s Climate_data_file.root
          ! grep -Ei 'error:|exception|could not open|could not create' conversion.log
          cat >/tmp/check_tree.C <<'CPP'
          void check_tree() {
              TFile f("Climate_data_file.root");
              TTree *tree = nullptr;
              f.GetObject("tree", tree);
              if (!tree || tree->GetEntries() <= 0) gSystem->Exit(1);
              TTreeReader reader(tree);
              TTreeReaderValue<std::string> station(reader, "stationName_");
              std::set<std::string> names;
              while (reader.Next()) names.insert(*station);
              std::cout << tree->GetEntries() << " entries across " << names.size() << " stations" << std::endl;
              gSystem->Exit(names.size() == 11 ? 0 : 1);
          }
          CPP
          sed -i '1i#include <set>\n#include <string>\n#include <TFile.h>\n#include <TTree.h>\n#include <TTreeReader.h>\n#include <TTreeReaderValue.h>\n#include <TSystem.h>\n#include <iostream>' /tmp/check_tree.C
          root -l -b -q /tmp/check_tree.C
      - name: Build and run all three analyses using the regenerated ROOT file
        run: |
          make -j2
          ./main
          test -s daily_mean_over_years.pdf
          test -s day_analysis.pdf
          test -s annual_cold_days.pdf
          test -s annual_cold_days.png
